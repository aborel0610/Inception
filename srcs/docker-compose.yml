version: '3'
services:
  mariadb:
    container_name: mariadb
    image: mariadb:42
    build: requirements/mariadb
    volumes: 
      - mariadb: /var/lib/mysql
    expose:
      - 3306
    env_file:
      - .env
    restart: unless-stopped
  nginx:
    container_name: nginx
    image: nginx:42
    build: requirements/nginx



volumes:
  mariadb:
    name: mariadb
    